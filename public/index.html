<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Me</title>

<style>

body{

font-family:Arial,Helvetica,sans-serif;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

background:white;
padding:30px;
border-radius:10px;
width:420px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

h2{

text-align:center;
margin-bottom:20px;

}

input,textarea{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;

}

textarea{

height:140px;
resize:none;

}

button{

width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

#response{

margin-top:15px;
text-align:center;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2>Contact Me</h2>

<form id="contactForm">

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="email"
name="email"
placeholder="Your Email"
required>

<input
type="text"
name="subject"
placeholder="Subject"
required>

<textarea
name="message"
placeholder="Your Message"
required></textarea>

<button type="submit">
Send Message
</button>

</form>

<p id="response"></p>

</div>

<script>

const form=document.getElementById("contactForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const data={
name:form.name.value,
email:form.email.value,
subject:form.subject.value,
message:form.message.value
};

const response=await fetch("/send",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});

const result=await response.json();

document.getElementById("response").innerText=result.message;

if(result.success){

form.reset();

}

});

</script>

</body>
</html>
