<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="16x16" href="public/favicon.ico">
<title>Contact</title>
<style>
  :root{
    --bg: #12112b;
    --bg-glow: #2a2766;
    --card: #201f49;
    --card-form: #19183d;
    --line: rgba(255,255,255,0.25);
    --line-focus: #8b85ff;
    --text: #ffffff;
    --muted: #a9a6c9;
    --accent: #7f7bff;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    background:
      radial-gradient(600px 400px at 8% 0%, var(--bg-glow), transparent 60%),
      var(--bg);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    color: var(--text);
  }

  .card{
    width: 100%;
    max-width: 850px;   /* Reduced from 1100px */
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    padding: 28px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 40px;
  }

  .logo{
    font-weight: 800;
    letter-spacing: 2px;
    font-size: 15px;
  }

  .menu-btn{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
    padding:6px;
  }
  .menu-btn span{
    width:22px;
    height:2px;
    background:var(--text);
    display:block;
  }

  .grid{
    display: grid;
    grid-template-columns: 45px 0.9fr 1fr;
    gap: 18px;
    align-items: start;
  }

  .socials{
    display:flex;
    flex-direction:column;
    gap:18px;
    padding-top: 4px;
  }
  .socials a{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text);
    text-decoration:none;
    opacity:0.85;
    transition: opacity .15s ease, border-color .15s ease;
  }
  .socials a:hover{
    opacity:1;
    border-color: var(--accent);
  }
  .socials svg{ width:16px; height:16px; }

  .info h1{
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 0 0 16px;
  }
  .info > p.lead{
    color: var(--muted);
    max-width: 320px;
    line-height: 1.6;
    font-size: 14px;
    margin-bottom: 36px;
  }

  .detail{
    margin-bottom: 22px;
  }
  .detail h3{
    font-size: 13px;
    letter-spacing: 1px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .detail p{
    margin:0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .form-card{
    background: var(--card-form);
    border-radius: 18px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
  }
  .form-card h2{
    text-align:center;
    font-size: 22px;
    letter-spacing: 1px;
    font-weight: 800;
    margin: 4px 0 32px;
  }

  .field{
    margin-bottom: 26px;
  }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .field input,
  .field textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    padding: 4px 2px 10px;
    font-family: inherit;
    outline:none;
    resize:none;
    transition: border-color .15s ease;
  }
  .field textarea{ min-height: 26px; }
  .field input:focus,
  .field textarea:focus{
    border-color: var(--line-focus);
  }
  .field input::placeholder,
  .field textarea::placeholder{
    color: rgba(255,255,255,0.25);
  }

  .form-footer{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:14px;
    margin-top: 8px;
  }

  #response{
    font-size: 13px;
    color: var(--muted);
  }

  button.send{
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 30px;
    border-radius: 12px;
    font-size: 14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    transition: background .15s ease, border-color .15s ease;
  }
  button.send:hover{
    background: rgba(255,255,255,0.14);
    border-color: var(--accent);
  }
  button.send:disabled{
    opacity: 0.6;
    cursor: default;
  }

  .spinner{
    display:none;
    width:14px;
    height:14px;
    border:2px solid rgba(255,255,255,.35);
    border-top:2px solid white;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }

  @media (max-width: 860px){
    .grid{
        grid-template-columns: 1fr;
    }

    .form-card{
        max-width: 100%;
    }

    .socials{
        flex-direction: row;
        justify-content: center;
        order: 3;
    }

    .card{
        padding: 24px 20px;
    }

    .info h1{
        font-size: 30px;
    }
}
</style>
</head>
<body>

<div class="card">

  <div class="topbar">
    <div class="logo">NOMADZ</div>
    <button class="menu-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="grid">

    <div class="socials">
      <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11.02 5 2.5 2.5 0 01-.02-5zM3 9h4v12H3V9zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.65c0-1.35-.02-3.08-1.88-3.08-1.88 0-2.17 1.47-2.17 2.98V21h-4V9z"/></svg></a>
      <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.7 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.22.6 1.77 1.15.55.55.89 1.11 1.15 1.77.25.64.42 1.37.47 2.43.05 1.06.06 1.42.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 01-1.15 1.77 4.9 4.9 0 01-1.77 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.42.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 01-1.77-1.15 4.9 4.9 0 01-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.7 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.22 1.15-1.77A4.9 4.9 0 015.45 2.53c.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.3 2 12 2zm0 5a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zm5.2-8.4a1.17 1.17 0 11-2.34 0 1.17 1.17 0 012.34 0z"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.25-1.5 1.55-1.5H16.7V3.7C16.4 3.66 15.4 3.57 14.2 3.57c-2.4 0-4.05 1.47-4.05 4.16V9.9H7.5V13h2.65v8h3.35z"/></svg></a>
      <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.9c-.7.32-1.46.53-2.25.63a3.9 3.9 0 001.72-2.16c-.76.46-1.6.78-2.5.96A3.9 3.9 0 0012.1 8.9c0 .3.03.6.1.88-3.24-.16-6.11-1.72-8.03-4.08a3.9 3.9 0 001.2 5.2 3.9 3.9 0 01-1.77-.49v.05c0 1.9 1.35 3.48 3.14 3.84-.33.09-.68.14-1.03.14-.25 0-.5-.02-.74-.07.5 1.56 1.94 2.7 3.66 2.73A7.83 7.83 0 012 18.4a11.05 11.05 0 005.98 1.75c7.18 0 11.1-5.95 11.1-11.1l-.01-.5c.76-.55 1.42-1.24 1.93-2.03z"/></svg></a>
      <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.5-.45-5.17a2.9 2.9 0 00-2.04-2.05C18.86 4.33 12 4.33 12 4.33s-6.86 0-8.51.45a2.9 2.9 0 00-2.04 2.05C1 8.5 1 12 1 12s0 3.5.45 5.17c.25.94 1 1.68 2.04 1.95 1.65.45 8.51.45 8.51.45s6.86 0 8.51-.45a2.9 2.9 0 002.04-1.95C23 15.5 23 12 23 12zM9.75 15.5v-7l6 3.5-6 3.5z"/></svg></a>
    </div>

    <div class="info">
      <h1>Contact</h1>
      <p class="lead">
        Have a project in mind or just want to say hello? Fill in the form
        and our team will get back to you within one business day.
      </p>

      <div class="detail">
        <h3>Address</h3>
        <p>533, Tower&#8209;B4, Spaze IT&#8209;Park,<br>Sohna Road, Sector 49, Gurugram&#8209;122018</p>
      </div>

      <div class="detail">
        <h3>Phone</h3>
        <p>Ph: +91 921-919-2104</p>
      </div>

      <div class="detail">
        <h3>Email</h3>
        <p>info@nomadz.digital</p>
      </div>
    </div>

    <div class="form-card">
      <h2>Get in touch</h2>

      <form id="contactForm">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" name="phone" placeholder="+1 234 567 8900">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us a bit about your project" required></textarea>
        </div>

        <div class="form-footer">
          <span id="response"></span>
          <button type="submit" class="send" id="submitBtn">
            <span id="btnText">Send Message</span>
            <span id="spinner" class="spinner"></span>
          </button>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
const form = document.getElementById("contactForm");
const spinner = document.getElementById("spinner");
const btnText = document.getElementById("btnText");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    spinner.style.display = "inline-block";
    btnText.innerText = "Sending...";

    const data = {
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        message: form.message.value
    };

    try {
        const response = await fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        document.getElementById("response").innerText = result.message;

        if (result.success) {
            form.reset();
        }

    } catch (error) {
        document.getElementById("response").innerText =
            "Unable to send your message. Please try again.";
    } finally {
        submitBtn.disabled = false;
        spinner.style.display = "none";
        btnText.innerText = "Send Message";
    }
});
</script>

</body>
</html>
